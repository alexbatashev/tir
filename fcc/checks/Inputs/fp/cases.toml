schema_version = 1

[reference]
profile = "gcc-15.2"
compiler_version = "15.2.0"

[[cases]]
id = "fma.binary64.value.separate"
stage = "reference"
source = "fcc/checks/Inputs/fp/reference/fma.c"
language_mode = "gnu17"
target_requirements = ["binary64", "fenv", "libm"]
compiler_args = ["-O0", "-frounding-math", "-fno-builtin"]
runtime_input_bits = ["0x3ff0000002000000", "0x3feffffffc000000", "0xbff0000000000000"]
run_args = ["separate"]
probe = "execute"

[cases.expectation]
kind = "exact_bits"
bits = "0x0000000000000000"
flags = ["inexact"]

[cases.oracle]
kind = "exact_derivation"
identity = "IEEE 754 binary64"
version = "2019"
reference = "oracle-provenance.toml#fma-binary64"

[[cases]]
id = "contraction.gnu17.same.default"
stage = "round"
source = "fcc/checks/Inputs/fp/reference/contraction.c"
language_mode = "gnu17"
target_requirements = ["x86_64", "haswell", "fma"]
compiler_args = ["-O2", "-march=haswell", "-DPROBE_SAME"]
runtime_input_bits = []
probe = "assembly"

[cases.expectation]
kind = "code_shape"
required = ["vfmadd"]
forbidden = ["vmulsd"]

[cases.oracle]
kind = "gcc_compatibility"
identity = "GCC"
version = "15.2.0"
reference = "oracle-provenance.toml#gcc-contraction"

[[cases]]
id = "fma.binary64.value.fused"
stage = "reference"
source = "fcc/checks/Inputs/fp/reference/fma.c"
language_mode = "gnu17"
target_requirements = ["binary64", "fenv", "libm"]
compiler_args = ["-O0", "-frounding-math", "-fno-builtin"]
runtime_input_bits = ["0x3ff0000002000000", "0x3feffffffc000000", "0xbff0000000000000"]
run_args = ["fused"]
probe = "execute"

[cases.expectation]
kind = "exact_bits"
bits = "0xbc90000000000000"
flags = []

[cases.oracle]
kind = "exact_derivation"
identity = "IEEE 754 binary64"
version = "2019"
reference = "oracle-provenance.toml#fma-binary64"
