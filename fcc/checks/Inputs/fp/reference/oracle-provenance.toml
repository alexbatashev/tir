schema_version = 1

[fma-binary64]
kind = "exact_derivation"
standard = "IEEE 754-2019"
inputs = ["a = 1 + 2^-27", "b = 1 - 2^-27", "c = -1"]
separate = "a*b is the midpoint 1 - 2^-54 and rounds to even 1 with inexact; adding -1 yields +0"
fused = "a*b+c is exactly -2^-54, encoded as 0xbc90000000000000 with no exception"

[mpfr]
version = "4.2.2"
availability = "required by later numerical-bound cases, not used for the closed-form FMA case"

[softfloat]
version = "3e"
availability = "not installed; cases that require it report missing infrastructure"

[gcc-contraction]
kind = "compatibility_observation"
compiler = "GCC 15.2.0"
target = "x86_64, -march=haswell"
scope = "GNU C17 and ISO C17 assembly under the recorded -ffp-contract modes"

[scale-binary64]
kind = "ieee_operation"
standard = "IEEE 754-2019"
operation = "binary64 division by the exact value 2 under roundTiesToEven"
nan_policy = "quiet NaNs retain GCC's observed payload; signaling NaNs are quieted and raise invalid"
tininess = "after rounding"

[directed-rounding]
kind = "ieee_operation"
standard = "IEEE 754-2019"
modes = ["roundTiesToEven", "roundTowardNegative", "roundTowardPositive", "roundTowardZero"]
scope = "binary64 arithmetic, binary64-to-binary32 conversion, and C llrint observations"

[observable-effects]
kind = "c_fenv"
standard = "ISO C17 plus the GNU feenableexcept extension for the trap case"
scope = "exception flags for unused arithmetic and ordered SIGFPE delivery around volatile stores"

[glibc-math-reporting]
kind = "c_math_reporting"
standard = "ISO C17"
library = "glibc 2.43 libm"
scope = "sqrt, log, and exp result bits, floating exceptions, and errno with sentinel 123"
